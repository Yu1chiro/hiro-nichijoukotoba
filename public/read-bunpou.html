<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EAF3FF" />
  <title>Note Bunpou | Nichijou Kotoba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    body { font-family: Inter, "Noto Sans JP", sans-serif; color: #26364d; background: #f8fbff; }
    .jp { font-family: "Noto Sans JP", Inter, sans-serif; }
    .panel { background: #fff; border: 1px solid #e3ebf4; border-radius: 24px; }
    .soft { box-shadow: 0 12px 42px rgba(81, 122, 166, 0.075); }
    .inp { width: 100%; background: #fff; border: 1px solid #d8e4f2; border-radius: 15px; padding: 13px 16px; outline: none; }
    .inp:focus { border-color: #7da8dd; box-shadow: 0 0 0 3px #eaf3ff; }
    .card { cursor: pointer; transition: 0.18s; text-align: left; }
    .card:hover { transform: translateY(-3px); border-color: #abc8ea; box-shadow: 0 16px 40px rgba(81, 122, 166, 0.12); }
    .fade { animation: fade 0.25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .seg { display: inline-flex; background: #edf4fc; border-radius: 14px; padding: 4px; gap: 4px; }
    .seg button { padding: 9px 14px; border-radius: 11px; font-weight: 700; font-size: .85rem; color: #5c7390; white-space: nowrap; transition: .15s; }
    .seg button.on { background: #537ebd; color: #fff; box-shadow: 0 4px 12px rgba(83,126,189,.25); }
    .fs { width: 38px; height: 38px; border-radius: 11px; background: #edf4fc; color: #385981; font-weight: 800; }
    .fs:active { transform: scale(.95); }
    .reader { max-width: 46rem; margin-inline: auto; }
    /* Tipografi artikel */
    .article { --fs: 1.0625rem; font-family: Inter, "Noto Sans JP", sans-serif; font-size: var(--fs); line-height: 1.9; letter-spacing: .005em; hyphens: auto; color: #2c3e57; overflow-wrap: anywhere; }
    .article > * + * { margin-top: 1.1em; }
    .article h1 { font-size: 2rem; font-weight: 800; line-height: 1.25; color: #1f2f46; margin-top: 1.6em; }
    .article h2 { font-size: 1.55rem; font-weight: 800; line-height: 1.3; color: #1f2f46; margin-top: 1.6em; padding-bottom: .3em; border-bottom: 1px solid #e3ebf4; }
    .article h3 { font-size: 1.25rem; font-weight: 700; color: #1f2f46; margin-top: 1.4em; }
    .article h4 { font-size: 1.1rem; font-weight: 700; margin-top: 1.3em; }
    .article strong, .article b { font-weight: 700; color: #1f2f46; }
    .article a { color: #3e6ca7; text-decoration: underline; text-underline-offset: 3px; }
    .article ul { list-style: disc; padding-left: 1.6em; }
    .article ol { list-style: decimal; padding-left: 1.6em; }
    .article li + li { margin-top: .35em; }
    .article blockquote { border-left: 4px solid #89aed9; background: #f1f7ff; padding: .8em 1.1em; border-radius: 0 14px 14px 0; color: #4a6283; font-style: italic; }
    .article pre { background: #1f2a3b; color: #e8eef7; padding: 1em 1.2em; border-radius: 14px; overflow-x: auto; font-size: .92rem; line-height: 1.6; white-space: pre-wrap; }
    .article code { background: #eef3fa; padding: .1em .4em; border-radius: 6px; font-size: .92em; }
    .article pre code { background: none; padding: 0; }
    .article hr { border: 0; border-top: 1px solid #e3ebf4; }
    .article .ql-align-center { text-align: center; }
    .article .ql-align-right { text-align: right; }
    .article .ql-align-justify { text-align: justify; }
    .article .ql-indent-1 { padding-left: 3em; } .article .ql-indent-2 { padding-left: 6em; } .article .ql-indent-3 { padding-left: 9em; }
    .article .ql-indent-4 { padding-left: 12em; } .article .ql-indent-5 { padding-left: 15em; }
    .article p { text-align: left; }
    @media (min-width: 1024px) { .article { --fs: 1.125rem; line-height: 1.95; } }
    @media (max-width: 640px) {
      .article { line-height: 1.85; }
      .article h1 { font-size: 1.5rem; } .article h2 { font-size: 1.3rem; } .article h3 { font-size: 1.15rem; }
      .article pre { font-size: .82rem; padding: .85em 1em; border-radius: 12px; }
      .article blockquote { padding: .7em .9em; }
      .article ul, .article ol { padding-left: 1.35em; }
      .article .ql-align-justify { text-align: left; }
    }
    @media (max-width: 640px) { .article .ql-indent-1 { padding-left: 1.5em; } .article .ql-indent-2 { padding-left: 3em; } .article .ql-indent-3 { padding-left: 4.5em; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#E7F2FF] via-[#F5F9FF] to-[#FCEEF6] bg-fixed">
  <div id="progress" class="fixed top-0 left-0 h-1 bg-[#537EBD] z-50 transition-all" style="width:0"></div>
  <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-[#E2EBF5]">
    <div class="max-w-5xl mx-auto px-4 sm:px-5 h-[60px] sm:h-[68px] flex items-center justify-between">
      <a href="#/" class="flex items-center gap-3 font-extrabold text-lg">
        <span class="w-10 h-10 bg-[#EAF3FF] rounded-xl grid place-items-center text-[#537EBD]"><i class="fa-solid fa-feather-pointed"></i></span>Note Bunpou
      </a>
      <a href="/" class="text-sm font-bold text-[#6786A7]"><i class="fa-solid fa-house mr-1"></i> Home</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-5 py-5 sm:py-8 md:py-12" style="padding-bottom:max(2rem,env(safe-area-inset-bottom))">
    <div id="view"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const view = $("view");
    const cache = { list: {}, notes: {} };
    let sortMode = "newest"; // newest | oldest
    let fontScale = 1;

    // ---- Status "sudah dibaca" (tersimpan di browser) ----
    const DONE_KEY = "bunpou_done_v1";
    function doneSet() {
      try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]").map(String)); } catch { return new Set(); }
    }
    function isDone(id) { return doneSet().has(String(id)); }
    function markDone(id) {
      try { const s = doneSet(); s.add(String(id)); localStorage.setItem(DONE_KEY, JSON.stringify([...s])); } catch {}
    }
    let readObserver = null;
    function watchReadEnd(id) {
      if (readObserver) { readObserver.disconnect(); readObserver = null; }
      const end = document.getElementById("readEnd");
      if (!end || isDone(id)) return;
      readObserver = new IntersectionObserver((entries) => {
        if (entries.some((e) => e.isIntersecting)) {
          markDone(id);
          readObserver.disconnect(); readObserver = null;
        }
      }, { threshold: 0, rootMargin: "0px 0px -8px 0px" });
      readObserver.observe(end);
    }

    function esc(x) {
      return String(x ?? "").split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;").split("'").join("&#39;");
    }
    function fmtDate(x) {
      return x ? new Date(x).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }) : "";
    }
    async function api(url) {
      const r = await fetch(url);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Error(j.error || "Gagal memuat data.");
      return j;
    }

    // ---- Sanitizer whitelist untuk HTML hasil Quill ----
    const ALLOWED = new Set("P BR STRONG B EM I U S STRIKE H1 H2 H3 H4 BLOCKQUOTE PRE CODE UL OL LI A SPAN DIV SUB SUP HR".split(" "));
    const DROP = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META", "SVG", "MATH", "FORM"]);
    function sanitize(html) {
      const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
      (function walk(node) {
        Array.from(node.childNodes).forEach((ch) => {
          if (ch.nodeType === 3) return;
          if (ch.nodeType !== 1) { ch.remove(); return; }
          if (DROP.has(ch.tagName.toUpperCase())) { ch.remove(); return; }
          if (!ALLOWED.has(ch.tagName)) { walk(ch); ch.replaceWith(...Array.from(ch.childNodes)); return; }
          Array.from(ch.attributes).forEach((a) => {
            const n = a.name.toLowerCase(), v = a.value;
            if (n === "class") {
              const k = v.split(/\s+/).filter((c) => /^ql-[a-z0-9-]+$/.test(c)).join(" ");
              k ? ch.setAttribute("class", k) : ch.removeAttribute("class");
            } else if (n === "style") {
              const keep = [];
              v.split(";").forEach((p) => {
                const parts = p.split(":"), key = (parts.shift() || "").trim().toLowerCase(), val = parts.join(":").trim();
                if ((key === "color" || key === "background-color") && /^(#[0-9a-f]{3,8}|rgba?\([\d\s,.%]+\)|[a-z]+)$/i.test(val)) keep.push(key + ":" + val);
              });
              keep.length ? ch.setAttribute("style", keep.join(";")) : ch.removeAttribute("style");
            } else if (n === "href" && ch.tagName === "A") {
              if (!/^(https?:|mailto:)/i.test(v.trim())) ch.removeAttribute("href");
            } else ch.removeAttribute(a.name);
          });
          if (ch.tagName === "A") { ch.setAttribute("target", "_blank"); ch.setAttribute("rel", "noopener noreferrer"); }
          walk(ch);
        });
      })(doc.body);
      return doc.body.innerHTML;
    }

    // ---- Views ----
    function skeleton() {
      return '<div class="text-center py-20 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-[#A2B8CF] mb-3"></i><br>Memuat...</div>';
    }
    function errorBox(msg) {
      return `<div class="panel p-10 text-center text-red-500">${esc(msg)}<div class="mt-5"><a href="#/" class="text-[#537EBD] font-bold">← Kembali ke daftar</a></div></div>`;
    }

    async function viewList() {
      document.title = "Note Bunpou | Nichijou Kotoba";
      document.getElementById("progress").style.width = "0";
      view.innerHTML = skeleton();
      try {
        if (!cache.list[sortMode]) cache.list[sortMode] = (await api("/api/bunpou?sort=" + sortMode)).data;
      } catch (e) { view.innerHTML = errorBox(e.message); return; }
      view.innerHTML = `<div class="fade space-y-7">
        <div class="rounded-[28px] p-7 md:p-9 soft bg-white/70 border border-white">
          <span class="text-xs font-bold tracking-widest text-[#6B91BA]">BUNPOU NOTES</span>
          <h1 class="jp text-3xl md:text-4xl font-bold mt-3">文法ノート</h1>
          <p class="text-[#687C94] mt-2">Kumpulan pola tata bahasa beserta penjelasannya. Klik kartu untuk membaca.</p>
          <div class="mt-6 flex flex-col sm:flex-row gap-3 sm:items-center">
            <div class="relative flex-1 max-w-xl"><i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
              <input id="q" class="inp !pl-11" placeholder="Cari pola atau isi catatan..." autocomplete="off" /></div>
            <div class="seg self-start" role="group" aria-label="Urutkan">
              <button id="sortNewest" class="${sortMode === "newest" ? "on" : ""}" onclick="setSort('newest')"><i class="fa-solid fa-arrow-down-wide-short mr-1"></i> Terbaru</button>
              <button id="sortOldest" class="${sortMode === "oldest" ? "on" : ""}" onclick="setSort('oldest')"><i class="fa-solid fa-arrow-up-short-wide mr-1"></i> Terlama</button>
            </div>
          </div>
          <p id="count" class="text-xs text-slate-400 mt-3"></p>
        </div>
        <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></div>`;
      const draw = () => {
        const q = ($("q").value || "").trim().toLowerCase();
        const items = cache.list[sortMode].filter((n) => !q || n.pola.toLowerCase().includes(q) || (n.excerpt || "").toLowerCase().includes(q));
        $("grid").innerHTML = items.length ? items.map((n) => `
          <a href="#/note/${n.id}" class="card panel soft p-6 flex flex-col gap-3 block">
            <div class="flex items-center justify-between text-[#A2B8CF]"><i class="fa-solid fa-feather-pointed"></i><span class="flex items-center gap-2 text-[11px] font-semibold">${esc(fmtDate(n.created_at))}${isDone(n.id) ? '<span class="w-6 h-6 rounded-full bg-[#DFF4ED] text-[#369374] grid place-items-center text-xs" title="Sudah dibaca" aria-label="Sudah dibaca"><i class="fa-solid fa-check"></i></span>' : ""}</span></div>
            <h2 class="jp font-bold text-xl text-[#26364D] leading-snug break-words">${esc(n.pola)}</h2>
            <p class="text-sm text-[#61758F] leading-relaxed line-clamp-3 flex-1">${esc(n.excerpt || "")}</p>
            <span class="text-sm font-bold text-[#537EBD] mt-1">Baca selengkapnya <i class="fa-solid fa-arrow-right ml-1"></i></span>
          </a>`).join("") : '<div class="col-span-full panel p-10 text-center text-slate-500">Belum ada catatan yang cocok.</div>';
      };
      $("count").textContent = cache.list[sortMode].length + " catatan · " + (sortMode === "newest" ? "terbaru lebih dulu" : "terlama lebih dulu");
      $("q").addEventListener("input", draw);
      draw();
    }

    function setSort(mode) {
      if (mode === sortMode) return;
      sortMode = mode;
      viewList();
    }
    function setFont(d) {
      fontScale = Math.min(1.4, Math.max(0.85, Math.round((fontScale + d) * 100) / 100));
      const a = document.querySelector(".article");
      if (a) a.style.fontSize = "calc(var(--fs) * " + fontScale + ")";
    }

    async function viewNote(id) {
      document.getElementById("progress").style.width = "0";
      view.innerHTML = skeleton();
      let n;
      try {
        n = cache.notes[id] || (cache.notes[id] = await api("/api/bunpou/" + id));
      } catch (e) { view.innerHTML = errorBox(e.message); return; }
      document.title = n.pola + " | Note Bunpou";
      view.innerHTML = `<article class="fade reader">
        <div class="flex items-center justify-between mb-4">
          <a href="#/" class="inline-flex items-center gap-2 text-sm font-bold text-[#6786A7]"><i class="fa-solid fa-arrow-left"></i> Semua Note</a>
          <div class="flex items-center gap-2" aria-label="Ukuran teks"><button class="fs" onclick="setFont(-0.05)" aria-label="Perkecil teks">A−</button><button class="fs" onclick="setFont(0.05)" aria-label="Perbesar teks">A+</button></div>
        </div>
        <div class="panel soft !rounded-[20px] sm:!rounded-[24px] px-5 py-6 sm:p-10 md:p-12">
          <span class="text-xs font-bold tracking-widest text-[#8EADD0]">BUNPOU</span>
          <h1 class="jp text-2xl sm:text-4xl font-extrabold leading-snug mt-3 break-words">${esc(n.pola)}</h1>
          <div class="text-sm text-slate-400 mt-4 pb-6 border-b border-[#E3EBF4]"><i class="fa-regular fa-calendar mr-1"></i>${esc(fmtDate(n.created_at))}${n.updated_at && n.updated_at !== n.created_at ? " · diperbarui " + esc(fmtDate(n.updated_at)) : ""}</div>
          <div class="article mt-6 sm:mt-8" style="font-size:calc(var(--fs) * ${fontScale})">${sanitize(n.penjelasan)}</div>
          <div id="readEnd" style="height:1px"></div>
        </div>
        <div class="text-center mt-8"><a href="#/" class="inline-flex items-center gap-2 rounded-2xl bg-[#537ebd] text-white font-bold px-6 py-3"><i class="fa-solid fa-list"></i> Kembali ke daftar</a></div>
      </article>`;
      watchReadEnd(id);
    }

    function viewNotFound() {
      view.innerHTML = errorBox("Halaman tidak ditemukan.");
    }

    // ---- Router (hash based SPA) ----
    const routes = [
      { name: "list", re: /^#?\/?$/, view: viewList },
      { name: "note", re: /^#\/note\/(\d+)\/?$/, view: viewNote },
    ];
    function router() {
      if (readObserver) { readObserver.disconnect(); readObserver = null; }
      const h = location.hash;
      for (const r of routes) {
        const m = h.match(r.re);
        if (m) { window.scrollTo(0, 0); return r.view(...m.slice(1)); }
      }
      viewNotFound();
    }
    window.addEventListener("hashchange", router);
    window.addEventListener("scroll", () => {
      const d = document.documentElement, max = d.scrollHeight - d.clientHeight;
      $("progress").style.width = /^#\/note\//.test(location.hash) && max > 0 ? Math.min(100, (d.scrollTop / max) * 100) + "%" : "0";
    }, { passive: true });
    router();
  </script>
</body>
</html>
